<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Edit | Login & Sign Up</title>
    <style>
        /* Modern Glassmorphism Design */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a192f 0%, #020c1b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: white;
        }

        .form-box { display: none; }
        .form-box.active { display: block; animation: fadeIn 0.5s ease; }

        h2 { text-align: center; color: #00d2ff; margin-bottom: 10px; font-size: 28px; }
        p.subtitle { text-align: center; font-size: 14px; opacity: 0.7; margin-bottom: 25px; }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .row { display: flex; gap: 10px; }

        .gender-box { margin: 15px 0; display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .gender-box input { width: auto; margin: 0; }

        .btn-main {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-main:hover { opacity: 0.9; transform: translateY(-2px); }

        .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; }
        .toggle-text a { color: #00d2ff; text-decoration: none; font-weight: bold; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="auth-container">
    <div id="signup-box" class="form-box active">
        <h2>Sign Up</h2>
        <p class="subtitle">Create your Cyber-Edit account</p>
        <div class="row">
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Last Name" required>
        </div>
        <input type="email" placeholder="Email Address" required>
        <input type="tel" placeholder="Mobile Number" required>
 <div>
                        <label class="block text-sm font-semibold mb-1"></label>
                        <select class="w-full p-3 border rounded-lg outline-none">
                            <option>Ethical Hacking</option>
                            <option>Video Editing</option>
                            <option>Combo Course</option>
                        </select>
                    </div>
        
        <div class="gender-box">
            <span>Gender:</span>
            <input type="radio" name="gen" id="m"> <label for="m">Male</label>
            <input type="radio" name="gen" id="f"> <label for="f">Female</label>
        </div>



        <input type="password" placeholder="Create Password" required>
        <button class="btn-main">Create Account</button>
        <p class="toggle-text">Already a member? <a onclick="toggleForm('login-box')">Login here</a></p>
    </div>

    <div id="login-box" class="form-box">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to access your dashboard</p>
        <input type="email" placeholder="Email / Mobile" required>
        <input type="password" placeholder="Password" required>


<div>
                        <label class="block text-sm font-semibold mb-1"></label>
                        <select class="w-full p-3 border rounded-lg outline-none">
                            <option>Ethical Hacking</option>
                            <option>Video Editing</option>
                            <option>Combo Course</option>
                        </select>
                    </div>


        <button class="btn-main">Login Now</button>
        <p class="toggle-text">New here? <a onclick="toggleForm('signup-box')">Sign up for free</a></p>
    </div>
</div>

        

<script>
    function toggleForm(id) {
        document.querySelectorAll('.form-box').forEach(box => box.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>



</body>
</html>
